name: Build ESP32-WROOM-32

on:
  push:
    branches:
      - claude/setup-bruce-firmware-esp32-vACk7
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'boards/esp32-wroom32/esp32-wroom32.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-wroom32

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-esp32-wroom32
          path: Bruce-esp32-wroom32.bin
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Bruce-esp32-wroom32.bin
          generate_release_notes: true
