; ──────────────────────────────────────────────────────────────────────────────
; Bruce firmware — ESP32-WROOM-32 custom target
;
; Hardware
;   Display  : SSD1306 128×64 OLED, I²C (SDA=GPIO21, SCL=GPIO22)
;   RFID     : RC522 (MFRC522), SPI (CS=GPIO5, SCK=GPIO18, MOSI=GPIO23,
;               MISO=GPIO19, RST=GPIO4 — tie RST to 3V3 or manage in firmware)
;   IR TX    : PN2222A transistor on GPIO12 (⚠ strapping pin — no pull-up!)
;   IR RX    : TSOP4838 on GPIO13
;   Buttons  : UP=GPIO35, SELECT=GPIO34, DOWN=GPIO2 (all active-LOW)
;              ⚠ GPIO34 & GPIO35 are input-only — external 10k pull-ups needed
;              ⚠ GPIO2  is a strapping pin — avoid pressing DOWN at power-on
;
; Flash / upload
;   Use esptool.py directly or PlatformIO's "Upload" target.
;   Set upload_port in platformio.ini [env] section or pass --port to esptool.
; ──────────────────────────────────────────────────────────────────────────────

[env:esp32-wroom32]
board                   = esp32-wroom32
board_build.partitions  = custom_4Mb_max.csv
build_src_filter        = ${env.build_src_filter} +<../boards/esp32-wroom32>

build_flags =
    ${env.build_flags}
    -Iboards/esp32-wroom32

    ; ── Device identity ──────────────────────────────────────────────────────
    -DDEVICE_NAME='"ESP32-WROOM-32"'

    ; ── Display — SSD1306 128×64 via LovyanGFX I²C ──────────────────────────
    -DHAS_SCREEN=1
    -DROTATION=1
    -DUSE_LOVYANGFX=1

    ; ── IR ───────────────────────────────────────────────────────────────────
    ; GPIO12 is driven LOW in _setup_gpio() before anything else.
    -DTXLED=12
    -DLED_ON=HIGH
    -DLED_OFF=LOW
    -DIR_TX_PINS='{{"IR TX (GPIO12)", 12}}'
    -DIR_RX_PINS='{{"IR RX (GPIO13)", 13}}'

    ; ── RF (OOK one-pin modules — optional, via Grove pins) ──────────────────
    -DRF_TX_PINS='{{"Grove SDA (GPIO21)", 21}}'
    -DRF_RX_PINS='{{"Grove SCL (GPIO22)", 22}}'

    ; ── SD card — not fitted ─────────────────────────────────────────────────
    -DSDCARD_CS=-1
    -DSDCARD_SCK=-1
    -DSDCARD_MISO=-1
    -DSDCARD_MOSI=-1

    ; ── SPI bus (shared by RC522 and any future SPI device) ──────────────────
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=5

    ; ── I²C bus ──────────────────────────────────────────────────────────────
    -DGROVE_SDA=21
    -DGROVE_SCL=22

    ; ── Buttons ──────────────────────────────────────────────────────────────
    -DHAS_BTN=1
    -DHAS_3_BUTTONS
    -DUP_BTN=35
    -DSEL_BTN=34
    -DDW_BTN=2
    -DBTN_ALIAS='"OK"'
    -DBTN_ACT=LOW

    ; ── CC1101 / NRF24 — not fitted ──────────────────────────────────────────
    -DCC1101_GDO0_PIN=-1
    -DCC1101_SS_PIN=-1
    -DCC1101_MOSI_PIN=SPI_MOSI_PIN
    -DCC1101_SCK_PIN=SPI_SCK_PIN
    -DCC1101_MISO_PIN=SPI_MISO_PIN
    -DNRF24_CE_PIN=-1
    -DNRF24_SS_PIN=-1
    -DNRF24_MOSI_PIN=SPI_MOSI_PIN
    -DNRF24_SCK_PIN=SPI_SCK_PIN
    -DNRF24_MISO_PIN=SPI_MISO_PIN

    ; ── USB / Bad-USB (GPIO12 used for IR, so disable HID) ───────────────────
    -DBAD_TX=GROVE_SDA
    -DBAD_RX=GROVE_SCL

lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.2.7
